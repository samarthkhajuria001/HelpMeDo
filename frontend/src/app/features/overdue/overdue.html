<div>
  <div class="overdue-page-header">
    <div class="header-icon">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
    </div>
    <div class="header-text">
      <h1 class="text-2xl font-semibold text-text-primary">Overdue</h1>
      <p class="header-subtitle">Tasks overdue by 4-14 days</p>
    </div>
  </div>

  @if (!loading() && pendingTasks().length === 0) {
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="empty-title">All caught up</p>
      <p class="empty-text">No overdue tasks older than 3 days</p>
    </div>
  } @else {
    <app-task-list [tasks]="pendingTasks()" [loading]="loading()" emptyVariant="no_tasks" />
  }
</div>
