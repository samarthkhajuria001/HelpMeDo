<div class="goal-page">
  @if (goal()) {
    <app-goal-header
      [goal]="goal()!"
      [completedCount]="completedCount()"
      [totalCount]="totalCount()"
      (edit)="onEdit()"
      (archive)="onArchive()"
    />
    <app-quick-add class="block mb-6" />
    <app-task-list [tasks]="tasks()" [loading]="loading()" />
  } @else if (loading()) {
    <div class="goal-loading">
      <div class="skeleton-title"></div>
    </div>
  } @else {
    <div class="goal-not-found">
      <span class="not-found-text">Goal not found</span>
    </div>
  }
</div>
