<!-- Onboarding Modal -->
@if (showOnboarding()) {
  <app-onboarding-modal (completed)="onOnboardingComplete()" />
}

<div class="min-h-screen bg-bg-primary">
  <!-- Header -->
  <app-header
    (menuClick)="toggleSidebar()"
    (aiClick)="toggleAIPanel()"
  />

  <div class="flex pt-14">
    <!-- Sidebar - Desktop -->
    <aside class="hidden lg:block w-60 fixed left-0 top-14 bottom-0 bg-bg-secondary border-r border-border-default overflow-y-auto">
      <!-- User Account -->
      <div class="p-2 border-b border-border-default">
        <app-user-account />
      </div>

      <!-- Navigation -->
      <nav class="p-4 space-y-1">
        <app-nav-item label="Today" route="/today" [count]="counts().today || null" />
        <app-nav-item label="This Week" route="/week" [count]="counts().week || null" />
        <app-nav-item label="Someday" route="/someday" [count]="counts().someday || null" />
        <div class="nav-divider"></div>
        <app-nav-item label="Completed" route="/completed" />
        <app-nav-item label="Overdue" route="/overdue" [count]="counts().overdue || null" />
      </nav>

      <!-- Goals -->
      <app-goals-section />
    </aside>

    <!-- Sidebar - Mobile Overlay -->
    @if (sidebarOpen()) {
      <div class="lg:hidden fixed inset-0 top-14 z-40">
        <div class="absolute inset-0 bg-black/40" (click)="closeSidebar()"></div>
        <aside class="absolute left-0 top-0 bottom-0 w-70 bg-bg-secondary shadow-xl overflow-y-auto">
          <!-- User Account -->
          <div class="p-2 border-b border-border-default">
            <app-user-account />
          </div>

          <!-- Navigation -->
          <nav class="p-4 space-y-1">
            <app-nav-item label="Today" route="/today" [count]="counts().today || null" (click)="closeSidebar()" />
            <app-nav-item label="This Week" route="/week" [count]="counts().week || null" (click)="closeSidebar()" />
            <app-nav-item label="Someday" route="/someday" [count]="counts().someday || null" (click)="closeSidebar()" />
            <div class="nav-divider"></div>
            <app-nav-item label="Completed" route="/completed" (click)="closeSidebar()" />
            <app-nav-item label="Overdue" route="/overdue" [count]="counts().overdue || null" (click)="closeSidebar()" />
          </nav>

          <!-- Goals -->
          <app-goals-section />
        </aside>
      </div>
    }

    <!-- Main Content -->
    <main class="flex-1 lg:ml-60 min-h-[calc(100vh-3.5rem)]">
      <div class="max-w-2xl mx-auto px-4 py-6 lg:px-6">
        <router-outlet />
      </div>
    </main>

    <!-- AI Panel - Desktop -->
    @if (aiPanelOpen()) {
      <aside class="hidden lg:block w-96 fixed right-0 top-14 bottom-0 bg-bg-surface border-l border-border-default shadow-lg overflow-hidden">
        <div class="h-full flex flex-col">
          <div class="flex justify-between items-center px-4 py-3 border-b border-border-default">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-500 to-red-400 flex items-center justify-center">
                <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2z"/>
                </svg>
              </div>
              <h2 class="font-semibold text-text-primary">Lufy</h2>
            </div>
            <button (click)="toggleAIPanel()" class="p-1.5 text-text-tertiary hover:text-text-primary hover:bg-bg-tertiary rounded-md transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="flex-1 overflow-hidden">
            <app-ai-chat />
          </div>
        </div>
      </aside>
    }
  </div>
</div>
