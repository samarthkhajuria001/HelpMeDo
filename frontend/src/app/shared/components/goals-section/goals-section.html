<div class="goals-section">
  <div class="section-header">
    <span class="section-title">Goals</span>
    <button class="add-button" (click)="openCreateModal()">
      <svg class="add-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>

  <!-- Goals list -->
  @if (loading()) {
    <div class="goals-loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  } @else if (goals().length === 0) {
    <div class="goals-empty">
      <span class="empty-text">No goals yet</span>
    </div>
  } @else {
    <div class="goals-list">
      @for (goal of goals(); track goal.id) {
        <app-goal-nav-item [goal]="goal" [count]="getGoalCount(goal.id)" />
      }
    </div>
  }
</div>

<!-- Create Goal Modal -->
@if (showCreateModal()) {
  <app-create-goal-modal
    (close)="closeCreateModal()"
    (create)="onCreateGoal($event)"
  />
}
