<div class="subtask-item" [class.completed]="isCompleted()">
  <!-- Checkbox -->
  <button type="button" class="checkbox" [class.checked]="isCompleted()" (click)="toggleStatus($event)">
    @if (isCompleted()) {
      <svg class="check-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
    }
  </button>

  <!-- Title -->
  <div class="content">
    @if (editing()) {
      <input
        type="text"
        class="title-input"
        [ngModel]="editedTitle()"
        (ngModelChange)="editedTitle.set($event)"
        (blur)="saveEdit()"
        (keydown)="onEditKeydown($event)"
        autofocus
      />
    } @else {
      <span class="title" (click)="startEdit($event)">{{ subtask().title }}</span>
    }
  </div>

  <!-- Delete -->
  <button type="button" class="delete-btn" (click)="onDelete($event)">
    <svg viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </button>
</div>
